```yaml
name: Update Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: >-
            theme=tokyo-night&
            bg_color=0D001A&
            color=A855F7&
            line=A855F7&
            point=A855F7&
            area_color=7C3AED&
            area=true&
            hide_border=true&
            custom_title=Lucas%20Cestaro%20Moreira%20-%20Contribution%20Graph&
            height=300&
            days=31&
            grid=false
          output_path: dist/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish activity graph
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
